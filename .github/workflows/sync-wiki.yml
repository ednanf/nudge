name: Sync Wiki after production deployment

on:
  status:
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: production-wiki
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ednanf/nudge' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.state == 'success' &&
        github.event.context == 'Vercel' &&
        github.event.sender.login == 'vercel[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted production branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Publish documentation for the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-wiki.py
